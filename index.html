<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrostEmpire</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* A fura, pislogó és forgó szem stílusa */
        .eye-container {
            position: relative;
            width: 130px;
            height: 75px;
            background: #ffffff;
            border-radius: 50% / 60% 60% 40% 40%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 35px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.25);
            animation: blink 4s infinite alternate;
        }

        .pupil {
            width: 40px;
            height: 40px;
            background: #000000;
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: crazy-look 3s infinite ease-in-out;
        }

        /* Ijesztő/fura macskaszem szerű pupilla részlet */
        .pupil::before {
            content: '';
            width: 8px;
            height: 28px;
            background: #ff0033;
            border-radius: 50%;
        }

        /* Szöveg stílus nagy kezdőbetűvel és ékezetekkel */
        .text {
            font-size: 1.6rem;
            font-weight: 500;
            letter-spacing: 3px;
            text-align: center;
            opacity: 0.9;
            animation: pulse 2s infinite alternate;
        }

        /* Szem mozgás animáció */
        @keyframes crazy-look {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-25px, -5px) scaleX(0.7); }
            40% { transform: translate(25px, 5px) scaleY(1.2); }
            60% { transform: translate(-10px, 10px); }
            80% { transform: translate(15px, -10px); }
        }

        /* Pislogás animáció */
        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.05); }
        }

        /* Szöveg pulzálás */
        @keyframes pulse {
            from { opacity: 0.4; text-shadow: 0 0 5px #fff; }
            to { opacity: 1; text-shadow: 0 0 15px #ff0033; }
        }
    </style>
</head>
<body>

    <div class="eye-container">
        <div class="pupil"></div>
    </div>

    <div class="text">Itt valami kezdődik.........</div>

</body>
</html>
